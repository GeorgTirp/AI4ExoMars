# Wandb sweep — model-variant comparison, V0: big encoder, context off.
# (reference)
#
# No context cache needed: this variant runs the encoder as a single
# (local) branch, so it can be launched immediately.
#
# Everything except the architecture is held constant across V0-V3; see
# MODEL_VARIANTS_EXPERIMENT.md §5. Only {width, use_context} differ BETWEEN
# variants, and only {learning_rate, weight_decay} are searched WITHIN one.
#
# Fixed architecture for this variant (supplied by run_variant_sweep.sh, not here --
# these sweeps run in-process through maybe_run_sweep, so a `command:` block would
# be silently ignored, exactly as noted in stage3_segmentation_finetune_sweep.yaml):
#   --model-kind context  --no-use-context  --random-init-encoder
#   --local-base-channels 52  --context-base-channels 26
#   --context-dim 256  --decoder-channels 256
#
# Initialise:
#   wandb sweep --project ai4exomars config/variant_v0_sweep.yaml
# Then submit agents: see vision_backend/training/SERVER_LAUNCH.md

program: vision_backend/train_stage3_segmentation_finetune.py
method: bayes

metric:
  name: val/miou
  goal: maximize

run_cap: 4

# No early_terminate: with only 4 runs per variant there is nothing to compare a
# straggler against, and killing one would leave the variant with fewer samples
# than its peers -- which would bias the between-variant comparison this exists for.

parameters:
  # The single-optimizer path (--use-muon off) is used for these runs, so these
  # two keys are the live ones; muon_lr/nadam_lr would be dead here.
  optimization.learning_rate:
    distribution: log_uniform_values
    min: 1.0e-4
    max: 3.0e-3

  optimization.weight_decay:
    distribution: log_uniform_values
    min: 1.0e-4
    max: 1.0e-1
