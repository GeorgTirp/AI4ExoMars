# Wandb sweep — model-variant comparison, V2: small encoder, context off.
# (width-reduced reference)
#
# No context cache needed: this variant runs the encoder as a single
# (local) branch, so it can be launched immediately.
#
# Everything except the architecture is held constant across V0-V3; see
# MODEL_VARIANTS_EXPERIMENT.md §5. Only {width, use_context} differ BETWEEN
# variants, and only {learning_rate, weight_decay} are searched WITHIN one.
#
# Fixed architecture for this variant (supplied by run_variant_sweep.sh, not here --
# these sweeps run in-process through maybe_run_sweep, so a `command:` block would
# be silently ignored, exactly as noted in stage3_segmentation_finetune_sweep.yaml):
#   --model-kind context  --no-use-context  --random-init-encoder
#   --local-base-channels 44  --context-base-channels 22
#   --context-dim 217  --decoder-channels 176
#
# Initialise:
#   wandb sweep --project ai4exomars config/variant_v2_sweep.yaml
# Then submit agents: see vision_backend/training/SERVER_LAUNCH.md

program: vision_backend/train_stage3_segmentation_finetune.py
method: bayes

metric:
  name: val/miou
  goal: maximize

# Ceiling on ATTEMPTS, not on successful trials -- only 4 jobs are queued, so
# 4 successes is still the target. The headroom exists because a failed run
# counts against the cap: v3 lost two of its four to "CUDA-capable device(s)
# is/are busy or unavailable" (a node whose GPU another job already held) and
# could then not replace them. With 8, a released job can still reach 4 good
# trials. Same value for v0-v3, so no variant gets more search than another.
run_cap: 8

# No early_terminate: with only 4 runs per variant there is nothing to compare a
# straggler against, and killing one would leave the variant with fewer samples
# than its peers -- which would bias the between-variant comparison this exists for.

parameters:
  # The single-optimizer path (--use-muon off) is used for these runs, so these
  # two keys are the live ones; muon_lr/nadam_lr would be dead here.
  # Upper bound cut from 3e-3 to 1e-3 on 2026-09-28. A rehearsal trial sampled
  # 1.98e-3 and hit non-finite loss 580 steps after the warmup peak, even with
  # --grad-clip-norm 1.0. The old range was set while weight decay was silently
  # crushing the model, so nothing ever reached a regime where a hot LR could
  # diverge. Identical across v0-v3.
  # 2026-09-29: ceiling cut again, 1e-3 -> 2e-4, on 16 trials of evidence.
  # EVERY trial at lr >= 2.23e-4 hit non-finite loss within 2-9 epochs (11 of
  # 11, across all four variants, with --grad-clip-norm 1.0 active). Both
  # trials at <= 1.8e-4 ran to completion. The threshold is sharp, so the old
  # range spent ~70% of its probability mass on runs that could not finish.
  # 2026-10-01: range moved DOWN, 5e-5..2e-4 -> 1.5e-5..1.2e-4, on the 17
  # completed 30-epoch trials (v0-v3, v3x, v2@1024). In 5 of 6 variants the
  # lowest-LR trial was best or within 0.002 of best, and above ~1.2e-4 every
  # variant got worse (v2@1024: 6.2e-5 -> 0.178, 1.45e-4 -> 0.168, 1.68e-4 ->
  # 0.160). The optimum sits at or below the old floor, so the new floor is ~3x
  # under the lowest LR tried. Identical across v0-v3.
  optimization.learning_rate:
    distribution: log_uniform_values
    min: 1.5e-5
    max: 1.2e-4

  # Narrowed from 1e-4 .. 1e-1 on 2026-09-28. Weight decay is what destroyed
  # the 2026-08-27 runs: create_optimizer applied it to LayerNorm/bias/layer-
  # scale params AND used coupled L2 (NAdam without decoupled_weight_decay), so
  # the model collapsed to the class prior. Both are fixed, but with run_cap: 4
  # a single trial sampled near 1e-1 still burns 25% of a variant's budget on a
  # value we now have evidence is harmful. Identical across v0-v3, so the
  # between-variant comparison is unaffected.
  optimization.weight_decay:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 1.0e-2
